schema: 1

apt:
  # Keep false while testing so future apply work cannot remove packages.
  enforce: true
  packages:
    - curl
    - git
    - python3
    - python3-pip
    - thonny
    - sonic-pi
    - figlet
    - code

python:
  packages:
    jamkit: "0.1.0"
    pygame: "2.6.1"
    gpiozero: "2.0.1.post3"
    guizero: "1.6.0"
    requests: "2.34.2"
    pillow: "12.3.0"
    pyserial: "3.5"

  
desktop:
  shortcuts:
    - vscode
    - sonic-pi

overlay:
  enabled: true

background:
  enabled: true
